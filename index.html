<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Your Consideration</title>
<meta name="description" content="For your consideration.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PALETTE — sampled directly from the cover art
   ============================================================ */
:root{
  --night:#0D101B;
  --night-2:#161A29;
  --violet:#2F263E;
  --violet-2:#3F425C;
  --moon:#A6AEBE;
  --moon-lit:#C9D3E3;
  --moon-white:#EDF1F7;
  --sun:#EFD388;
  --amber:#E58D22;
  --ember:#BC472B;

  --display:"Archivo",Helvetica,Arial,sans-serif;
  --tech:"Archivo",Helvetica,Arial,sans-serif;

  --gut:clamp(20px,5vw,84px);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--night);
  color:var(--moon-lit);
  font-family:var(--tech);
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit}

/* ============================================================
   HERO — built on the cover's sun→moon diagonal
   ============================================================ */
.hero{
  position:relative;
  min-height:100svh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:var(--gut);
  isolation:isolate;
}
.hero-img{
  position:absolute;
  inset:-12% 0 -12% 0;
  background:var(--night);
  z-index:-3;
  transform:translateZ(0);
  backface-visibility:hidden;
}
.hero-img img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center;
  display:block;
  transform:translateZ(0);
}
.hero-veil{
  position:absolute;inset:0;z-index:-2;
  background:
    radial-gradient(120% 80% at 22% 74%, rgba(188,71,43,.26), transparent 62%),
    radial-gradient(90% 70% at 68% 26%, rgba(166,174,190,.20), transparent 60%),
    linear-gradient(to bottom, rgba(13,16,27,.62) 0%, rgba(13,16,27,.18) 34%, rgba(13,16,27,.40) 66%, rgba(13,16,27,.94) 100%);
}
.stars{position:absolute;inset:0;z-index:-1;pointer-events:none}

/* moon-side block, upper right */
.hero-top{
  display:flex;
  justify-content:flex-end;
  text-align:right;
  opacity:0;
  transform:translateY(-14px);
  animation:rise 1.5s .35s cubic-bezier(.16,.84,.34,1) forwards;
}
.fyc{
  font-family:var(--display);
  text-transform:uppercase;
  font-weight:700;
  font-size:clamp(13px,1.85vw,22px);
  letter-spacing:.04em;
  color:var(--moon-white);
  margin:0;
  text-shadow:0 0 34px rgba(166,174,190,.7),0 2px 16px rgba(0,0,0,.7);
}
.gr{
  font-size:calc(1em + 6px);
  font-weight:700;
  letter-spacing:.03em;
}
.rmark{
  font-size:.42em;
  vertical-align:super;
  line-height:0;
  letter-spacing:0;
  margin-left:.08em;
}
.hero-top .langs{
  font-family:var(--tech);
  font-size:clamp(9.5px,1vw,11.5px);
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--moon);
  margin:10px 0 0;
}
.who{
  font-family:var(--tech);
  font-size:clamp(10px,1.1vw,12.5px);
  font-weight:500;
  letter-spacing:.16em;
  color:var(--moon);
  margin:12px 0 0;
  text-transform:uppercase;
}

/* sun-side block, lower left */
.hero-bottom{
  max-width:min(22ch,94vw);
  opacity:0;
  transform:translateY(26px);
  animation:rise 1.8s .7s cubic-bezier(.16,.84,.34,1) forwards;
}
.album{
  font-family:var(--display);
  font-weight:300;
  font-size:clamp(42px,8.6vw,124px);
  line-height:.96;
  text-transform:uppercase;
  letter-spacing:-.012em;
  margin:0;
  color:var(--sun);
  text-shadow:0 0 70px rgba(229,141,34,.5),0 0 140px rgba(188,71,43,.35),0 4px 30px rgba(0,0,0,.6);
}
.artist{
  font-family:var(--display);
  font-weight:400;
  text-transform:uppercase;
  font-size:min(clamp(16px,3.4vw,50px), 7.4vw);
  line-height:1.1;
  letter-spacing:-.005em;
  margin:min(3.2vw,26px) 0 0;
  color:var(--moon-white);
  white-space:nowrap;
}
.tagline{
  font-size:clamp(12px,1.35vw,15px);
  line-height:1.65;
  color:var(--moon);
  margin:18px 0 0;
  max-width:44ch;
}
.cue{
  position:absolute;
  left:50%;bottom:20px;
  transform:translateX(-50%);
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(201,211,227,.5);
  opacity:0;animation:rise 1.6s 1.9s ease forwards;
}
.cue::after{
  content:"";display:block;width:1px;height:34px;margin:12px auto 0;
  background:linear-gradient(to bottom,rgba(201,211,227,.55),transparent);
}
@keyframes rise{to{opacity:1;transform:none}}

/* ============================================================
   SHARED SECTION FURNITURE
   ============================================================ */
section{padding:clamp(48px,7.5vh,100px) var(--gut);position:relative}
.eyebrow{
  font-family:var(--display);
  
  font-size:clamp(15px,1.8vw,21px);
  color:var(--amber);
  margin:0 0 clamp(18px,2.4vw,30px);
  letter-spacing:.01em;
}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s cubic-bezier(.16,.84,.34,1),transform 1.1s cubic-bezier(.16,.84,.34,1)}
.reveal.in{opacity:1;transform:none}

/* ---- narrative ---- */
.tale{
  overflow:hidden;
  background:
    radial-gradient(80% 55% at 12% 8%, rgba(188,71,43,.16), transparent 65%),
    radial-gradient(70% 60% at 92% 88%, rgba(63,66,92,.4), transparent 62%),
    var(--night);
}
.tale-grid{display:grid;grid-template-columns:1fr;gap:clamp(26px,3.4vw,46px);max-width:1180px}
.tale-words{display:grid;gap:clamp(26px,3.4vw,46px);min-width:0;align-content:center;padding-bottom:clamp(24px,5vh,64px)}
.portrait{
  margin:0;
  align-self:end;
  justify-self:end;
  max-width:min(340px,72vw);
  width:100%;
  margin-bottom:calc(-1 * clamp(48px,7.5vh,100px));
  margin-right:calc(-1 * var(--gut));
}
.portrait img{
  display:block;width:100%;height:auto;
  filter:drop-shadow(0 26px 50px rgba(0,0,0,.6));
  transform:translateZ(0);
}
@media (min-width:900px){
  .tale-grid{
    grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);
    align-items:end;
    gap:clamp(34px,4vw,68px);
  }
  .tale-words{grid-column:1;grid-row:1}
  .portrait{
    grid-column:2;grid-row:1;
    align-self:end;justify-self:end;
    max-width:min(460px,42vw);
  }
}
.lede{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(25px,3.6vw,50px);
  line-height:1.16;
  letter-spacing:-.008em;
  color:var(--moon-white);
  margin:0;
  max-width:19ch;
}
.lede em{font-style:normal;color:var(--sun)}
.body-copy{font-size:clamp(14px,1.15vw,16px);line-height:1.85;color:var(--moon);max-width:58ch}
.body-copy p{margin:0 0 1.1em}
.body-copy p:last-child{margin:0}
@media(min-width:900px){
  .tale-grid{grid-template-columns:1.05fr .95fr;align-items:start}
}

/* ---- categories: a constellation, not a list ---- */
.consider{
  background:
    radial-gradient(105% 70% at 50% 120%, rgba(229,141,34,.17), transparent 66%),
    var(--night-2);
  text-align:center;
}
.cats{list-style:none;margin:0 auto;padding:0;max-width:1000px}
.cats li{
  position:relative;
  padding:clamp(14px,2vw,24px) 0;
}
.cats li + li::before{
  content:"";
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;
  background:var(--moon);
  box-shadow:0 0 14px 3px rgba(166,174,190,.6);
}
.cat-name{
  display:block;
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(24px,4.4vw,58px);
  line-height:1.08;
  letter-spacing:-.01em;
  color:var(--moon-white);
  transition:color .5s,text-shadow .5s;
}
.cats li:hover .cat-name{color:var(--sun);text-shadow:0 0 48px rgba(239,211,136,.55)}
.cat-credit{
  display:block;
  font-size:clamp(10.5px,1vw,12.5px);
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--moon);
  margin-top:clamp(9px,1.1vw,15px);
}

/* ---- tracks ---- */
.tracks{background:var(--night)}
.track-list{list-style:none;margin:0;padding:0;max-width:1180px}
.track{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:clamp(18px,3vw,46px);
  align-items:baseline;
  padding:clamp(15px,1.9vw,23px) 0;
  border-top:1px solid rgba(166,174,190,.17);
}
.track:last-child{border-bottom:1px solid rgba(166,174,190,.17)}
.track-n{
  font-family:var(--tech);
  font-size:clamp(11px,1.05vw,13px);
  letter-spacing:.14em;
  color:var(--amber);
  padding-top:.55em;
}
.track-title{
  font-family:var(--display);
  font-weight:400;
  font-size:clamp(23px,3.6vw,46px);
  line-height:1.1;
  letter-spacing:-.01em;
  color:var(--moon-white);
  margin:0;
}
.track-note{font-size:clamp(12.5px,1.05vw,14.5px);line-height:1.7;color:var(--moon);margin:10px 0 0;max-width:56ch}
.track.lead .track-title{color:var(--sun)}
.track-flag{
  display:inline-block;margin-left:14px;vertical-align:middle;
  font-family:var(--tech);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--night);background:var(--sun);padding:4px 9px;border-radius:999px;
}



.btn{
  display:inline-flex;align-items:center;gap:11px;
  font-family:var(--tech);font-size:13px;letter-spacing:.11em;text-transform:uppercase;
  padding:17px 34px;border-radius:999px;
  text-decoration:none;transition:transform .35s,box-shadow .35s,background .35s;
}
.btn-solid{background:var(--sun);color:#1A1206;box-shadow:0 0 0 rgba(239,211,136,0)}
.btn-solid:hover{transform:translateY(-2px);box-shadow:0 14px 46px rgba(239,211,136,.34)}
.btn-ghost{border:1px solid rgba(166,174,190,.42);color:var(--moon-lit)}
.btn-ghost:hover{border-color:var(--moon-white);transform:translateY(-2px)}
.btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:clamp(26px,3.5vw,40px)}

/* ---- listen ---- */
.listen{text-align:center;background:var(--night);
  background-image:radial-gradient(90% 60% at 50% 0%, rgba(229,141,34,.14), transparent 65%)}

/* ---- credits ---- */
.credits{background:var(--night);border-top:1px solid rgba(166,174,190,.16)}
.cred-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:clamp(22px,3vw,40px);
  max-width:1180px;
}
.cred-grid h3{
  font-family:var(--tech);font-size:10px;font-weight:500;letter-spacing:.17em;
  text-transform:uppercase;color:var(--amber);margin:0 0 9px;
}
.cred-grid p{font-size:13.5px;line-height:1.7;color:var(--moon);margin:0}
footer{
  padding:34px var(--gut) 54px;
  font-size:11px;letter-spacing:.06em;color:rgba(166,174,190,.45);
  text-align:center;line-height:1.9;
}

/* ---- track play affordance ---- */
.track{cursor:pointer;transition:background .4s}
.track:hover{background:rgba(166,174,190,.045)}
.track-title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.play-dot{
  flex:none;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(166,174,190,.45);
  display:inline-flex;align-items:center;justify-content:center;
  transition:border-color .35s,background .35s,transform .35s;
}
.track:hover .play-dot{border-color:var(--sun);transform:scale(1.06)}
.play-dot svg{width:12px;height:12px;fill:var(--moon-lit);transition:fill .35s}
.track:hover .play-dot svg{fill:var(--sun)}
.track.playing .play-dot{background:var(--sun);border-color:var(--sun)}
.track.playing .play-dot svg{fill:#1A1206}
.track.playing .track-title{color:var(--sun)}

/* ---- sticky player bar ---- */
.player{
  position:fixed;left:0;right:0;bottom:0;z-index:900;
  display:flex;align-items:center;gap:clamp(10px,2vw,20px);
  padding:11px clamp(14px,4vw,34px);
  background:rgba(13,16,27,.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(166,174,190,.18);
  transform:translateY(110%);transition:transform .6s cubic-bezier(.16,.84,.34,1);
}
.player.up{transform:none}
.pbtn{
  flex:none;background:none;border:0;padding:8px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .3s,transform .2s;
}
.pbtn:hover{background:rgba(166,174,190,.14)}
.pbtn:active{transform:scale(.9)}
.pbtn svg{width:15px;height:15px;fill:var(--moon-lit)}
.pbtn.main{background:var(--sun);width:42px;height:42px}
.pbtn.main svg{fill:#1A1206;width:15px;height:15px}
.pbtn.main:hover{background:var(--sun);box-shadow:0 0 30px rgba(239,211,136,.45)}
.p-meta{flex:1;min-width:0}
.p-title{
  font-family:var(--display);font-weight:400;text-transform:uppercase;
  font-size:clamp(12px,1.5vw,15px);letter-spacing:.02em;color:var(--moon-white);
  margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.p-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--moon);margin:3px 0 0}
.p-bar{
  position:absolute;left:0;right:0;top:0;height:2px;
  background:rgba(166,174,190,.18);cursor:pointer;
}
.p-fill{height:100%;width:0;background:linear-gradient(to right,var(--amber),var(--sun));transition:width .15s linear}
.p-time{font-size:10.5px;letter-spacing:.08em;color:var(--moon);flex:none;font-variant-numeric:tabular-nums}
@media(max-width:600px){.p-time{display:none}}
body{padding-bottom:72px}

@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
  .reveal{opacity:1;transform:none}
  .hero-top,.hero-bottom,.cue{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
/* ---- press ---- */
.press{
  background:
    radial-gradient(60% 50% at 50% 0%, rgba(63,66,92,.34), transparent 66%),
    var(--night);
  border-top:1px solid rgba(166,174,190,.10);
  border-bottom:1px solid rgba(166,174,190,.10);
}
.press-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:clamp(30px,4vw,64px);
  max-width:1180px;
  margin:0 auto;
}
.quote{margin:0;position:relative;padding-top:26px}
.quote::before{
  content:"";
  position:absolute;left:0;top:0;
  width:28px;height:1px;
  background:linear-gradient(to right,var(--amber),rgba(239,211,136,0));
}
.quote p{
  font-family:var(--display);
  font-weight:300;
  font-size:clamp(17px,1.75vw,23px);
  line-height:1.38;
  letter-spacing:-.004em;
  color:var(--moon-white);
  margin:0;
}
.quote cite{
  display:block;
  font-family:var(--display);
  font-style:normal;
  font-weight:600;
  font-size:clamp(13px,1.35vw,17px);
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--amber);
  margin:20px 0 0;
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-img" id="heroImg"><img id="heroPic" alt="" decoding="async" fetchpriority="high"></div>
  <div class="hero-veil"></div>
  <canvas class="stars" id="stars"></canvas>

  <div class="hero-top">
    <div>
      <p class="fyc" id="fycLine">For your <span class="gr">Grammy<sup class="rmark">&#174;</sup></span> consideration</p>
      <p class="who" id="whoLine"></p>
    </div>
  </div>

  <div class="hero-bottom">
    <h1 class="album" id="albumTitle"></h1>
    <p class="langs" id="langsLine"></p>
    <p class="artist" id="artistName"></p>
    <p class="tagline" id="tagline"></p>
  </div>

  <div class="cue">Scroll</div>
</header>

<section class="tale">
  <div class="tale-grid">
    <figure class="portrait reveal">
      <img id="artistPic" src="artist.webp" alt="Gilbert-Michel Rolle" loading="lazy" decoding="async">
    </figure>
    <div class="tale-words">
      <p class="lede reveal" id="lede"></p>
      <div class="body-copy reveal" id="taleCopy"></div>
    </div>
  </div>
</section>

<section class="press">
  <p class="eyebrow reveal" style="text-align:center">In the press</p>
  <div class="press-grid" id="pressGrid"></div>
</section>

<section class="consider">
  <p class="eyebrow reveal" style="text-align:center">For your consideration in</p>
  <ul class="cats" id="cats"></ul>
</section>

<section class="tracks">
  <p class="eyebrow reveal" id="tracksEyebrow">The cycle, told in reverse</p>
  <ul class="track-list" id="trackList"></ul>
</section>

<section class="listen">
  <div class="reveal">
    <p class="eyebrow" style="text-align:center">Hear the recording</p>
    <div class="btn-row" id="listenRow"></div>
  </div>
</section>

<section class="credits">
  <p class="eyebrow reveal">Credits</p>
  <div class="cred-grid reveal" id="credGrid"></div>
</section>


<div class="player" id="player">
  <div class="p-bar" id="pBar"><div class="p-fill" id="pFill"></div></div>
  <button class="pbtn" id="pPrev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M7 6v12H5V6h2zm12 0v12l-9-6 9-6z"/></svg></button>
  <button class="pbtn main" id="pPlay" aria-label="Play"><svg viewBox="0 0 24 24" id="pIcon"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="pbtn" id="pNext" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M17 6v12h2V6h-2zM5 6v12l9-6-9-6z"/></svg></button>
  <div class="p-meta">
    <p class="p-title" id="pTitle">—</p>
    <p class="p-sub">Chants des Équinoxes</p>
  </div>
  <span class="p-time" id="pTime">0:00</span>
</div>

<footer>
  <p id="footLine"></p>
</footer>

<script>
/* ============================================================================
   EDIT EVERYTHING HERE. Nothing below this block needs touching.
   ============================================================================ */
const FYC = {

  artist:   "Gilbert-Michel Rolle",
  role:     "Swiss-American Tenor · Composer",
  album:    "Chants des Équinoxes",
  langs:    "Songs in English, French and Spanish",

  tagline:  "An original orchestral song cycle entirely composed and sung by the same artist.",

  /* --- the narrative section --- */
  lede:     "The fleeting perfection of a celestial balance, this work navigates the threshold between day and night. The composition achieves a profound sonic <em>equilibrium</em>, seamlessly alternating between soaring, radiant melodies and deep, orphic explorations of the dark.",
  tale: [
    "Chants des Équinoxes is an original orchestral song cycle composed and performed by Swiss-American tenor Gilbert-Michel Rolle, recorded with the Havana Lyceum Orchestra at Abdala Studios in Havana.",
    "It marks a rare contemporary classical achievement: a principal vocalist serving as composer, poet, and soloist across a single unified, cross-cultural work."
  ],

  /* --- FYC categories. Keep to four to six. --- */
  categories: [
    { name: "Best Classical Solo Vocal Album",
      credit: "Gilbert-Michel Rolle, tenor · Marlon Daniel, conductor · Havana Lyceum Orchestra" },
    { name: "Best Engineered Album, Classical",
      credit: "Jamshed Turel" },
    { name: "Best Arrangement, Instruments and Vocals",
      credit: "Jamshed Turel, Gilbert-Michel Rolle" }
  ],

  /* --- five tracks, numbered as they sit on the record --- */
  tracksEyebrow: "Five movements",
  tracks: [
    { n:"I",   title:"Clair-Obscur", lead:true,
      src:"01_Clair_Obscur_Chants_des_Equinoxes_256kb.mp3", note:"" },
    { n:"II",  title:"Incantation", src:"02_Incantation_Chants_des_Equinoxes_256kb.mp3", note:"" },
    { n:"III", title:"Barbara",     src:"03_Barbara_Chants_des_Equinoxes_256kb.mp3",     note:"" },
    { n:"IV",  title:"Harlem",      src:"04_Harlem_Chants_des_Equinoxes_256kb.mp3",      note:"" },
    { n:"V",   title:"Marinero",    src:"05_Marinero_Chants_des_Equinoxes_256kb.mp3",    note:"Soprano \u2014 Dunia Pedraza" }
  ],

  /* --- outbound links --- */
  listen: [
    { label:"Listen",        url:"https://linktr.ee/projectequinoxes", solid:true  },
    { label:"Visit the website", url:"https://gilbertmichelrolle.com/", solid:false }
  ],

  /* --- press. Career notices, honestly attributed. No dates. --- */
  press: [
    { quote:"Swiss tenor Gilbert-Michel Rolle has a lyrical voice and adapted it skillfully to the emotions deeply anchored.",
      source:"The Washington Post" },
    { quote:"With unaffected charm, Rolle shaped the exquisite flow of melody.",
      source:"The Washington Post" },
    { quote:"The recognition of his talent as a performer and a tribute to the beauty of his vocal range.",
      source:"Le Temps" }
  ],

  credits: [
    { role:"Composed & written by",  names:"Gilbert-Michel Rolle" },
    { role:"Tenor",                  names:"Gilbert-Michel Rolle" },
    { role:"Orchestra",              names:"Havana Lyceum Orchestra" },
    { role:"Conductor",              names:"Marlon Daniel" },
    { role:"Soprano",                names:"Dunia Pedraza" },
    { role:"Recorded at",            names:"Abdala Studios, Havana, Cuba" },
    { role:"Engineered & produced by", names:"Jamshed Turel" },
    { role:"Edited, mixed & mastered at", names:"T11 Studios, Canada" },
    { role:"Published by",           names:"ArtistWorld Publishing" },
    { role:"Animation & art direction", names:"Leonard Daniels Jr." }
  ],

  label: "Centaurus Classics",

  /* Swap this for your own hosted file in production, e.g. "assets/cover.jpg" */
  cover: "cover.jpg"
};

/* ============================================================================
   RENDER
   ============================================================================ */
(function(){
  const $ = (s)=>document.querySelector(s);
  const esc = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  $('#heroPic').src = FYC.cover;
  document.title = FYC.album + " — For your consideration";

  $('#whoLine').textContent   = FYC.artist + " · " + FYC.role;
  $('#albumTitle').textContent= FYC.album;
  $('#langsLine').textContent  = FYC.langs;
  $('#artistName').textContent= FYC.artist;
  $('#tagline').textContent   = FYC.tagline;
  $('#lede').innerHTML        = FYC.lede;
  $('#taleCopy').innerHTML    = FYC.tale.map(p=>'<p>'+esc(p)+'</p>').join('');
  $('#tracksEyebrow').textContent = FYC.tracksEyebrow;
  $('#footLine').textContent  = FYC.label + " · " + FYC.artist;

  $('#pressGrid').innerHTML = FYC.press.map(q=>
    '<blockquote class="quote reveal"><p>&#8220;'+esc(q.quote)+'&#8221;</p><cite>'+esc(q.source)+'</cite></blockquote>'
  ).join('');

  $('#cats').innerHTML = FYC.categories.map(c=>
    '<li><span class="cat-name">'+esc(c.name)+'</span><span class="cat-credit">'+esc(c.credit)+'</span></li>'
  ).join('');

  const PLAY_SVG = '<span class="play-dot"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
  $('#trackList').innerHTML = FYC.tracks.map((t,i)=>
    '<li class="track'+(t.lead?' lead':'')+'" data-i="'+i+'">'+
      '<span class="track-n">'+esc(t.n)+'</span>'+
      '<div><h3 class="track-title">'+PLAY_SVG+'<span>'+esc(t.title)+'</span>'+
        (t.flag?'<span class="track-flag">'+esc(t.flag)+'</span>':'')+'</h3>'+
        (t.note?'<p class="track-note">'+esc(t.note)+'</p>':'')+
      '</div></li>'
  ).join('');

  $('#credGrid').innerHTML = FYC.credits.map(c=>
    '<div><h3>'+esc(c.role)+'</h3><p>'+esc(c.names)+'</p></div>'
  ).join('');

  $('#listenRow').innerHTML = FYC.listen.map(l=>
    '<a class="btn '+(l.solid?'btn-solid':'btn-ghost')+'" href="'+esc(l.url)+'">'+esc(l.label)+'</a>'
  ).join('');

  /* ---- Starfield ---- */
  const cv = $('#stars'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars=[], W=0, H=0;
  function seed(){
    W = cv.width  = cv.offsetWidth  * devicePixelRatio;
    H = cv.height = cv.offsetHeight * devicePixelRatio;
    const n = Math.round((cv.offsetWidth*cv.offsetHeight)/5200);
    stars = Array.from({length:Math.min(n,320)},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:(Math.random()*1.35+.28)*devicePixelRatio,
      d:Math.random()*.55+.18,
      p:Math.random()*Math.PI*2,
      s:Math.random()*.018+.004
    }));
  }
  function drawStars(t){
    cx.clearRect(0,0,W,H);
    for(const s of stars){
      const tw = reduce ? .62 : .45 + Math.sin(t*s.s + s.p)*.42;
      cx.globalAlpha = Math.max(0,Math.min(1,tw)) * s.d;
      cx.fillStyle = s.x/W > .5 ? '#D6DEEC' : '#F3E2B4';
      cx.beginPath(); cx.arc(s.x,s.y,s.r,0,6.284); cx.fill();
    }
    cx.globalAlpha=1;
  }
  seed(); drawStars(0);
  let rzT = null, lastW = 0, lastH = 0;
  addEventListener('resize',()=>{
    if(rzT) clearTimeout(rzT);
    rzT = setTimeout(()=>{
      rzT = null;
      const w = cv.offsetWidth, h = cv.offsetHeight;
      if(w === lastW && h === lastH) return;
      lastW = w; lastH = h;
      seed();
      drawStars(performance.now());
    }, 180);
  },{passive:true});

  /* ---- Parallax + twinkle loop ---- */
  const heroImg = $('#heroImg');
  let y = 0, ticking = false;
  let rafId = null, visible = true, playing = false;
  let fade = 1, fadeTarget = 1;

  function shouldRun(){ return !reduce && visible && !playing; }

  let lastY = -1;
  function frame(t){
    rafId = null;
    if(visible && y !== lastY){
      lastY = y;
      heroImg.style.transform = 'translate3d(0,'+(y*0.34)+'px,0) scale(1.06)';
      cv.style.transform      = 'translate3d(0,'+(y*-0.14)+'px,0)';
    }
    fade += (fadeTarget - fade) * 0.045;
    if(fade < 0.002) fade = 0;
    cv.style.opacity = fade.toFixed(3);
    if(fade > 0) drawStars(t);
    if(shouldRun() || fade > 0.004) rafId = requestAnimationFrame(frame);
  }

  function startLoop(){
    fadeTarget = 1;
    if(rafId === null && !reduce) rafId = requestAnimationFrame(frame);
  }
  function stopLoop(){
    fadeTarget = 0;
    if(rafId === null && !reduce) rafId = requestAnimationFrame(frame);
  }

  const heroWatch = new IntersectionObserver((es)=>{
    visible = es[0].isIntersecting;
    if(shouldRun()) startLoop(); else stopLoop();
  },{threshold:0});
  heroWatch.observe(cv);

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ playing = playing || false; stopLoop(); }
    else if(shouldRun()) startLoop();
  });
  addEventListener('scroll',()=>{
    y = scrollY;
    if(reduce && !ticking){
      ticking = true;
      requestAnimationFrame(()=>{heroImg.style.transform='none';ticking=false});
    }
  },{passive:true});
  cv.style.opacity = '1';
  if(!reduce) startLoop();

  /* ---- Section reveals ---- */
  const io = new IntersectionObserver((es)=>{
    es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:.16, rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));


  /* ---- Audio player ---- */
  const audio = new Audio();
  audio.preload = 'none';
  const bar    = $('#player');
  const pPlay  = $('#pPlay');
  const pIcon  = $('#pIcon');
  const pTitle = $('#pTitle');
  const pTime  = $('#pTime');
  const pFill  = $('#pFill');
  const pBarEl = $('#pBar');
  const ICON_PLAY  = 'M8 5v14l11-7z';
  const ICON_PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  let cur = -1;

  const fmt = (s)=>{
    if(!isFinite(s)) return '0:00';
    const m = Math.floor(s/60), r = Math.floor(s%60);
    return m + ':' + String(r).padStart(2,'0');
  };

  function paint(){
    document.querySelectorAll('.track').forEach(el=>{
      const on = Number(el.dataset.i)===cur && !audio.paused;
      el.classList.toggle('playing', on);
      const p = el.querySelector('.play-dot path');
      if(p) p.setAttribute('d', on ? ICON_PAUSE : ICON_PLAY);
    });
    pIcon.setAttribute('d', audio.paused ? ICON_PLAY : ICON_PAUSE);
    pPlay.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
  }

  audio.addEventListener('play', ()=>{ playing = true;  stopLoop(); });
  audio.addEventListener('pause',()=>{ playing = false; if(shouldRun()) startLoop(); });
  audio.addEventListener('ended',()=>{ playing = false; if(shouldRun()) startLoop(); });

  function load(i, autoplay){
    const t = FYC.tracks[i];
    if(!t || !t.src) return;
    cur = i;
    audio.src = t.src;
    pTitle.textContent = t.title;
    bar.classList.add('up');
    if(autoplay){
      audio.play().catch(()=>{ paint(); });
    }
    paint();
  }

  function toggle(i){
    if(i===cur){
      audio.paused ? audio.play().catch(()=>{}) : audio.pause();
      paint();
    }else{
      load(i, true);
    }
  }

  $('#trackList').addEventListener('click',(e)=>{
    const li = e.target.closest('.track');
    if(!li) return;
    toggle(Number(li.dataset.i));
  });

  pPlay.addEventListener('click',()=>{
    if(cur<0){ load(0,true); return; }
    audio.paused ? audio.play().catch(()=>{}) : audio.pause();
    paint();
  });
  $('#pPrev').addEventListener('click',()=>{
    if(audio.currentTime > 3 && !audio.paused){ audio.currentTime = 0; return; }
    load((cur<=0 ? FYC.tracks.length-1 : cur-1), true);
  });
  $('#pNext').addEventListener('click',()=>{
    load((cur+1) % FYC.tracks.length, true);
  });

  audio.addEventListener('play', paint);
  audio.addEventListener('pause', paint);
  audio.addEventListener('ended', ()=>{
    if(cur < FYC.tracks.length-1) load(cur+1, true);
    else { cur=-1; pFill.style.width='0'; pTime.textContent='0:00'; pTitle.textContent='\u2014'; paint(); }
  });
  audio.addEventListener('timeupdate', ()=>{
    if(audio.duration){
      pFill.style.width = (audio.currentTime/audio.duration*100) + '%';
      pTime.textContent = fmt(audio.currentTime);
    }
  });
  audio.addEventListener('error', ()=>{
    pTitle.textContent = 'Track unavailable';
    paint();
  });

  pBarEl.addEventListener('click',(e)=>{
    if(!audio.duration) return;
    const r = pBarEl.getBoundingClientRect();
    audio.currentTime = ((e.clientX - r.left)/r.width) * audio.duration;
  });

  addEventListener('keydown',(e)=>{
    if(e.code==='Space' && cur>=0 && !/INPUT|TEXTAREA|BUTTON|A/.test(e.target.tagName)){
      e.preventDefault();
      audio.paused ? audio.play().catch(()=>{}) : audio.pause();
      paint();
    }
  });

  paint();

})();
</script>
</body>
</html>
